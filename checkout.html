<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout</title><link rel="stylesheet" href="/css/style.css"></head>
<body><header><a class="logo" href="/">ShopEasy</a></header>
<div class="formbox"><h1>Checkout</h1><h2>Total: ₹<span th:text="${total}">0</span></h2>
<form action="/checkout" method="post"><input name="customerName" placeholder="Full Name" required><textarea name="address" placeholder="Delivery Address" required></textarea>
<input placeholder="Card Number (demo)" required><div class="twocol"><input placeholder="MM/YY" required><input placeholder="CVV" required></div>
<button class="btn" type="submit">Place Order</button></form></div></body></html>
