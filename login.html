<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login</title><link rel="stylesheet" href="/css/style.css"></head>
<body><header><a class="logo" href="/">ShopEasy</a></header>
<div class="formbox"><h1>Login</h1><p class="error" th:if="${error}" th:text="${error}"></p>
<form action="/login" method="post"><input name="username" placeholder="Username" required><input type="password" name="password" placeholder="Password" required><button class="btn" type="submit">Login</button></form>
<p>New user? <a href="/signup">Create account</a></p></div></body></html>
