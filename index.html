<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShopEasy - Home</title><link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header><a class="logo" href="/">ShopEasy</a><nav>
<a href="/">Home</a><a href="/products">Products</a><a href="/cart/view">Cart</a><a href="/login">Login</a>
</nav></header>
<section class="hero"><div><h1>Simple Shopping, Better Living</h1><p>Quality non-branded products at affordable prices.</p><a class="btn" href="/products">Shop Now</a></div></section>
<section class="section"><h2>Featured Products</h2><div class="grid">
<div class="card" th:each="p : ${products}">
<div class="pic" th:text="${p.name.substring(0,1)}">P</div>
<h3 th:text="${p.name}">Product</h3><p th:text="${p.description}">Description</p>
<strong>₹<span th:text="${p.price}">0</span></strong><a class="btn small" th:href="@{'/products/' + ${p.id}}">View</a>
</div></div></section>
<footer>© 2026 ShopEasy</footer>
</body></html>
